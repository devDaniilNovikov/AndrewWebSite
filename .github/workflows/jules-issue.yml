name: Jules - Approved issue

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  invoke-jules:
    name: Invoke Jules
    if: >-
      github.repository == 'devDaniilNovikov/AndrewWebSite' &&
      github.event.repository.default_branch == 'main' &&
      vars.JULES_AUTOMATION_ENABLED == 'true' &&
      vars.JULES_ALLOWED_ACTOR != '' &&
      github.event.label.name == 'jules-action' &&
      github.actor == vars.JULES_ALLOWED_ACTOR &&
      github.event.issue.user.login == vars.JULES_ALLOWED_ACTOR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      TRUSTED_SHA: ${{ github.sha }}
      EXPECTED_REPOSITORY: devDaniilNovikov/AndrewWebSite
    steps:
      - name: Check out trusted task manifests
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify trusted checkout
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]]; then
            echo "Refusing a non-canonical repository." >&2
            exit 1
          fi
          if [[ ! "$ISSUE_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "Issue number is not a canonical positive integer." >&2
            exit 1
          fi
          if [[ ! "$TRUSTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Trusted checkout SHA is invalid." >&2
            exit 1
          fi

          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$TRUSTED_SHA" ]]; then
            echo "Trusted checkout SHA mismatch." >&2
            exit 1
          fi

          manifest=".github/jules-tasks/$ISSUE_NUMBER.json"
          if [[ ! -f "$manifest" || -L "$manifest" ]]; then
            echo "No trusted main manifest exists for this issue number." >&2
            exit 1
          fi

      - name: Prepare private Jules workspace
        id: jules_workspace
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${RUNNER_TEMP:-}" || ! -d "$RUNNER_TEMP" || -L "$RUNNER_TEMP" ]]; then
            echo "RUNNER_TEMP is unavailable or unsafe." >&2
            exit 1
          fi
          umask 077
          workspace="$(mktemp -d "$RUNNER_TEMP/jules-issue.XXXXXX")"
          case "$workspace" in
            "$RUNNER_TEMP"/jules-issue.*) ;;
            *)
              echo "Refusing an unexpected Jules workspace path." >&2
              exit 1
              ;;
          esac
          printf 'path=%s\n' "$workspace" >>"$GITHUB_OUTPUT"

      - name: List Jules sources
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_WORKSPACE: ${{ steps.jules_workspace.outputs.path }}
        run: |
          set -euo pipefail

          if [[ -z "$JULES_API_KEY" ]]; then
            echo "JULES_API_KEY is not configured." >&2
            exit 1
          fi
          case "$JULES_WORKSPACE" in
            "$RUNNER_TEMP"/jules-issue.*) ;;
            *)
              echo "Refusing an unexpected Jules workspace path." >&2
              exit 1
              ;;
          esac
          if [[ ! -d "$JULES_WORKSPACE" || -L "$JULES_WORKSPACE" ]]; then
            echo "The Jules workspace is missing or unsafe." >&2
            exit 1
          fi

          umask 077
          api_root='https://jules.googleapis.com/v1alpha'
          sources_ndjson="$JULES_WORKSPACE/sources.ndjson"
          sources_file="$JULES_WORKSPACE/sources.json"
          seen_tokens_file="$JULES_WORKSPACE/seen-page-tokens.txt"
          : >"$sources_ndjson"
          : >"$seen_tokens_file"

          page_token=''
          for ((page_number = 1; page_number <= 20; page_number++)); do
            page_file="$JULES_WORKSPACE/sources-page-$page_number.json"
            curl_args=(
              --proto '=https'
              --tlsv1.2
              --fail
              --silent
              --show-error
              --connect-timeout 10
              --max-time 60
              --max-filesize 5242880
              --retry 2
              --retry-all-errors
              --get
              --header "X-Goog-Api-Key: $JULES_API_KEY"
              --data-urlencode 'pageSize=100'
              --output "$page_file"
            )
            if [[ -n "$page_token" ]]; then
              curl_args+=(--data-urlencode "pageToken=$page_token")
            fi

            curl "${curl_args[@]}" "$api_root/sources"

            if ! jq -e '
              type == "object" and
              ((.sources // []) | type == "array") and
              ((.nextPageToken // "") |
                type == "string" and
                length <= 2048 and
                (test("[[:cntrl:]]") | not))
            ' "$page_file" >/dev/null 2>&1; then
              echo "Jules returned a malformed source page." >&2
              exit 1
            fi

            jq -c '.sources[]?' "$page_file" >>"$sources_ndjson"
            next_page_token="$(jq -r '.nextPageToken // empty' "$page_file")"
            if [[ -z "$next_page_token" ]]; then
              page_token=''
              break
            fi
            if grep -Fqx -- "$next_page_token" "$seen_tokens_file"; then
              echo "Jules repeated a source page token." >&2
              exit 1
            fi
            printf '%s\n' "$next_page_token" >>"$seen_tokens_file"
            page_token="$next_page_token"
          done

          if [[ -n "$page_token" ]]; then
            echo "Jules source pagination exceeded the safe page limit." >&2
            exit 1
          fi

          jq -s '{sources: .}' "$sources_ndjson" >"$sources_file"

      - name: Build validated Jules payload
        shell: bash
        env:
          JULES_WORKSPACE: ${{ steps.jules_workspace.outputs.path }}
        run: |
          set -euo pipefail

          case "$JULES_WORKSPACE" in
            "$RUNNER_TEMP"/jules-issue.*) ;;
            *)
              echo "Refusing an unexpected Jules workspace path." >&2
              exit 1
              ;;
          esac
          if [[ ! -d "$JULES_WORKSPACE" || -L "$JULES_WORKSPACE" ]]; then
            echo "The Jules workspace is missing or unsafe." >&2
            exit 1
          fi

          sources_file="$JULES_WORKSPACE/sources.json"
          payload_file="$JULES_WORKSPACE/session-request.json"
          bash .github/scripts/build-jules-issue-payload.sh \
            .github/jules-tasks \
            "$ISSUE_NUMBER" \
            "$TRUSTED_SHA" \
            "$GITHUB_REPOSITORY" \
            "$sources_file" >"$payload_file"

          if ! jq -e '
            .requirePlanApproval == true and
            .automationMode == "AUTO_CREATE_PR" and
            .sourceContext.githubRepoContext.startingBranch == "main" and
            (.sourceContext.source | type == "string") and
            (.prompt | type == "string" and length > 0)
          ' "$payload_file" >/dev/null 2>&1; then
            echo "Refusing an invalid Jules session payload." >&2
            exit 1
          fi

      - name: Create approval-gated Jules session
        shell: bash
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_WORKSPACE: ${{ steps.jules_workspace.outputs.path }}
        run: |
          set -euo pipefail

          if [[ -z "$JULES_API_KEY" ]]; then
            echo "JULES_API_KEY is not configured." >&2
            exit 1
          fi
          case "$JULES_WORKSPACE" in
            "$RUNNER_TEMP"/jules-issue.*) ;;
            *)
              echo "Refusing an unexpected Jules workspace path." >&2
              exit 1
              ;;
          esac
          if [[ ! -d "$JULES_WORKSPACE" || -L "$JULES_WORKSPACE" ]]; then
            echo "The Jules workspace is missing or unsafe." >&2
            exit 1
          fi

          api_root='https://jules.googleapis.com/v1alpha'
          payload_file="$JULES_WORKSPACE/session-request.json"
          response_file="$JULES_WORKSPACE/session-response.json"
          if [[ ! -f "$payload_file" || -L "$payload_file" ]]; then
            echo "The validated Jules payload is missing or unsafe." >&2
            exit 1
          fi
          expected_source="$(jq -r '.sourceContext.source // empty' "$payload_file")"

          curl \
            --proto '=https' \
            --tlsv1.2 \
            --fail \
            --silent \
            --show-error \
            --connect-timeout 10 \
            --max-time 60 \
            --max-filesize 5242880 \
            --request POST \
            --header "X-Goog-Api-Key: $JULES_API_KEY" \
            --header 'Content-Type: application/json' \
            --data-binary "@$payload_file" \
            --output "$response_file" \
            "$api_root/sessions"

          if ! jq -e --arg expected_source "$expected_source" '
            type == "object" and
            (.name |
              type == "string" and
              length <= 489 and
              startswith("sessions/") and
              (test("[[:cntrl:]]") | not) and
              (.[9:] | length > 0 and (contains("/") | not))) and
            .sourceContext.source == $expected_source
          ' "$response_file" >/dev/null 2>&1; then
            echo "Jules returned an invalid session response." >&2
            exit 1
          fi

          printf 'Created a Jules session for approved issue #%s; plan approval remains required.\n' "$ISSUE_NUMBER"

      - name: Remove Jules workspace
        if: always()
        shell: bash
        env:
          JULES_WORKSPACE: ${{ steps.jules_workspace.outputs.path }}
        run: |
          set -euo pipefail

          if [[ -z "$JULES_WORKSPACE" ]]; then
            exit 0
          fi
          case "$JULES_WORKSPACE" in
            "$RUNNER_TEMP"/jules-issue.*) ;;
            *)
              echo "Refusing to remove an unexpected workspace path." >&2
              exit 1
              ;;
          esac
          if [[ -L "$JULES_WORKSPACE" ]]; then
            echo "Refusing to remove a symbolic-link workspace." >&2
            exit 1
          fi
          if [[ -d "$JULES_WORKSPACE" ]]; then
            rm -rf -- "$JULES_WORKSPACE"
          fi
