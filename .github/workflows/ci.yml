name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "task-*"
      - "fix-*"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-policy:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate source branch name
        if: github.event_name != 'workflow_dispatch'
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          allowed='^(main|task-[a-z0-9][a-z0-9-]*|fix-[a-z0-9][a-z0-9-]*)$'
          if [[ ! "$BRANCH_NAME" =~ $allowed ]]; then
            echo "Unsupported branch name: $BRANCH_NAME" >&2
            exit 1
          fi

      - name: Validate pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        shell: bash
        run: |
          set -euo pipefail
          conventional='^(feat|fix|docs|test|refactor|perf|chore|ci)(\([a-z0-9._/-]+\))?!?: .+'
          if [[ ! "$PR_TITLE" =~ $conventional ]]; then
            echo "PR title must follow Conventional Commits." >&2
            exit 1
          fi

      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        shell: bash
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --output "$archive_path" "$url"
          printf '%s  %s\n' "$ACTIONLINT_SHA256" "$archive_path" | sha256sum --check --status
          tar -xzf "$archive_path" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -version

      - name: Validate GitHub Actions workflows
        shell: bash
        run: |
          "$RUNNER_TEMP/actionlint" -color

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Set up Temurin 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify
        run: ./mvnw -B verify

  dependency-security:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Scan dependencies for known vulnerabilities
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          vulnerability-check: true
          warn-only: false

  java-security:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Initialize CodeQL for Java
        uses: github/codeql-action/init@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1
        with:
          languages: java-kotlin
      - name: Set up Temurin 25
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build for analysis
        run: ./mvnw -B -DskipTests package
      - name: Analyze
        uses: github/codeql-action/analyze@b7351df727350dca84cb9d725d57dcf5bc82ba26 # v3.37.1

  frontend-quality:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check changed files
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Determine the base commit for git diff.
          # If we are on main branch, we compare HEAD with its parent HEAD~1.
          # On any other branch or PR, we compare with origin/main.
          if [ "${{ github.ref_name }}" = "main" ]; then
            if git rev-parse HEAD~1 >/dev/null 2>&1; then
              BASE_COMMIT="HEAD~1"
            else
              BASE_COMMIT="HEAD"
            fi
          else
            BASE_COMMIT="origin/main"
          fi

          echo "Comparing HEAD against $BASE_COMMIT"

          # Use git diff -z to get NUL-separated filenames, then pipe to our verification script.
          # We run the script to see if the changes are "relevant" or "skip".
          # Since the script is in our repository, we execute it directly.
          # Note: if BASE_COMMIT equals HEAD, git diff is empty, which is handled correctly.
          RESULT=$(git diff --name-only -z "$BASE_COMMIT"...HEAD | .github/scripts/verify-ci-paths.sh)

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Workflow dispatched manually. Forcing full run."
            RESULT="relevant"
          fi

          if [ "$RESULT" = "relevant" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Frontend-relevant changes detected. Full quality run required."
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No frontend-relevant changes detected. Returning success check early."
          fi

      - name: Set up Node.js 24.14.0
        if: steps.filter.outputs.skip != 'true'
        uses: actions/setup-node@39225d617d30d94d110d79d83c3e7cf24127ae8b # v4.1.0
        with:
          node-version: '24.14.0'

      - name: Enable Corepack and manifest-declared package manager
        if: steps.filter.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install -g corepack@0.34.5
          corepack enable

      - name: Install dependencies with frozen lockfile
        if: steps.filter.outputs.skip != 'true'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Install Playwright Chromium browser only
        if: steps.filter.outputs.skip != 'true'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm exec playwright install chromium

      - name: Run complete frontend verification contract
        if: steps.filter.outputs.skip != 'true'
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          pnpm run verify
