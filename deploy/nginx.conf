# Public entry point of the container. Runs as uid 10001, so every writable path is in /tmp.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    server_tokens off;
    # Request lines carry no PII today, but client addresses would; keep no access log.
    access_log off;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    # The platform proxy appends the visitor address as the last X-Forwarded-For element.
    # Without that header (local runs) the TCP peer is the visitor.
    map $http_x_forwarded_for $lead_client_ip {
        default $remote_addr;
        "~^(?:.*,\s*)?(?<forwarded_client>[0-9A-Fa-f.:]+)\s*$" $forwarded_client;
    }

    server {
        listen 8080 default_server;
        root /var/www/html;
        index index.html;

        location = /api/leads {
            client_max_body_size 32k;
            proxy_pass http://127.0.0.1:8090;
            proxy_http_version 1.1;
            proxy_connect_timeout 2s;
            proxy_read_timeout 20s;
            proxy_set_header Host $host;
            proxy_set_header Connection "";
            # The application trusts only X-Real-IP from loopback; drop every other
            # forwarded header so a visitor cannot choose their own address or scheme.
            proxy_set_header X-Real-IP $lead_client_ip;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_set_header X-Forwarded-Port "";
            proxy_set_header X-Forwarded-Proto "";
            proxy_set_header Forwarded "";
        }

        location /api/ {
            return 404;
        }

        location /actuator/ {
            return 404;
        }

        location /_next/static/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
        }

        # Extensionless document URLs (/privacy) must win over same-named export directories.
        location / {
            try_files $uri.html $uri $uri/ /index.html;
        }
    }
}
