spring:
  application:
    name: andrew-website
  profiles:
    active: prod
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mvc:
    problemdetails:
      enabled: true
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 10s
      redirects: dont-follow
  web:
    error:
      path: /error
      include-exception: false
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-path: never
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
app:
  privacy:
    retention:
      anonymize-after: 29d
      hard-limit: 30d
      delete-after: P12M
      poll-interval: 1h
      batch-size: 100
  telegram:
    worker:
      poll-interval: 15s
      batch-size: 10
      lease: 2m
      retry-initial: 30s
      retry-maximum: 6h
  web:
    max-request-bytes: 16384
    rate-limit:
      enabled: true
      max-clients: 10000
      client-idle-ttl: 1h
      global-limit: 60
      global-window: 1m
      client-capacity: 5
      client-refill: 1m
management:
  opentelemetry:
    enabled: false
    map-environment-variables: false
  otlp:
    metrics:
      export:
        enabled: false
  health:
    db:
      enabled: false
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      access: READ_ONLY
      show-details: never
      show-components: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState 
        readiness:
          include: readinessState
sentry:
  enabled: false
  debug: false
  enable-external-configuration: false
  enable-spotlight: false
  enable-pretty-serialization-output: false
  use-git-commit-id-as-release: false
  send-modules: false
  attach-stacktrace: false
  attach-threads: false
  print-uncaught-stack-trace: false
  send-client-reports: false
  enable-auto-session-tracking: false
  capture-open-telemetry-events: false
  enable-database-transaction-tracing: false
  enable-cache-tracing: false
  enable-queue-tracing: false
  trace-options-requests: false
  propagate-traceparent: false
  trace-propagation-targets: []
  max-feature-flags: 0
  sample-rate: 1.0
  send-default-pii: false
  max-request-body-size: none
  max-breadcrumbs: 0
  strict-trace-continuation: true
  traces-sample-rate: 0.0
  profile-session-sample-rate: 0.0
  enable-app-start-profiling: false
  start-profiler-on-app-start: false
  enable-legacy-profiling: false
  profile-lifecycle: TRACE
  logs:
    enabled: false
  logging:
    enabled: false
  metrics:
    enabled: false
server:
  forward-headers-strategy: none
  port: ${PORT:8080}
