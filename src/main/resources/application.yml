spring:
  application:
    name: andrew-website
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  mvc:
    problemdetails:
      enabled: true
  http:
    clients:
      connect-timeout: 3s
      read-timeout: 10s
      redirects: dont-follow
  web:
    error:
      path: /error
      include-exception: false
      include-message: never
      include-binding-errors: never
      include-stacktrace: never
      include-path: never
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    clean-disabled: true
  jackson:
    datatype:
      enum:
        fail-on-numbers-for-enums: true
    deserialization:
      fail-on-unknown-properties: true
    mapper:
      allow-coercion-of-scalars: false
app:
  privacy:
    retention:
      anonymize-after: 29d
      hard-limit: 30d
      delete-after: P12M
      poll-interval: 1h
      batch-size: 100
  telegram:
    worker:
      poll-interval: 15s
      batch-size: 10
      lease: 2m
      retry-initial: 30s
      retry-maximum: 6h
  web:
    max-request-bytes: 16384
    rate-limit:
      enabled: true
      max-clients: 10000
      client-idle-ttl: 1h
      global-limit: 60
      global-window: 1m
      client-capacity: 5
      client-refill: 1m
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      access: READ_ONLY
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState
server:
  forward-headers-strategy: none
