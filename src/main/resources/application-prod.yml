spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: "off"
    log-startup-info: false
management:
  otlp:
    metrics:
      export:
        enabled: true
        url: ${OTLP_METRICS_URL}
        headers:
          Authorization: ${OTLP_AUTHORIZATION}
        step: 30s
sentry:
  enabled: true
  dsn: ${SENTRY_DSN}
  environment: prod
  server-name: andrew-website
  debug: false
  enable-external-configuration: false
  enable-spotlight: false
  enable-pretty-serialization-output: false
  use-git-commit-id-as-release: false
  send-modules: false
  sample-rate: 1.0
  send-default-pii: false
  max-request-body-size: none
  max-breadcrumbs: 0
  strict-trace-continuation: true
  traces-sample-rate: 0.10
  profile-session-sample-rate: 1.0
  profile-lifecycle: TRACE
  logs:
    enabled: true
  logging:
    enabled: false
  metrics:
    enabled: true
logging:
  structured:
    format:
      console: ecs
    json:
      context:
        include: false
  level:
    root: "OFF"
    com.zaxxer.hikari: "OFF"
    io.micrometer.core.instrument.push: "OFF"
    io.micrometer.registry.otlp: "OFF"
    org.apache.catalina: "OFF"
    org.flywaydb: "OFF"
    org.postgresql: "OFF"
    ru.andrew.website.common.ProductionStartupFailureReporter: ERROR
    ru.andrew.website.observability.TelemetryConfiguration: ERROR
    org.springframework.jdbc: "OFF"
    org.springframework.web: "OFF"
app:
  leads:
    fingerprint-key: ${LEAD_FINGERPRINT_HMAC_KEY}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    chat-id: ${TELEGRAM_CHAT_ID}
    base-url: https://api.telegram.org
