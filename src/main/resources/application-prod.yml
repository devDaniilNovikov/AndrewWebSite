spring:
  config:
    activate:
      on-profile: prod
  main:
    banner-mode: "off"
    log-startup-info: false
server:
  address: 127.0.0.1
  port: 8090
  forward-headers-strategy: native
  tomcat:
    remoteip:
      remote-ip-header: X-Real-IP
      internal-proxies: 127\.0\.0\.1
management:
  server:
    address: 127.0.0.1
    port: 8081
logging:
  structured:
    format:
      console: ecs
    json:
      context:
        include: false
  level:
    root: "OFF"
    org.apache.catalina: "OFF"
    org.springframework.web: "OFF"
    ru.andrew.website.common.ProductionStartupFailureReporter: ERROR
    ru.andrew.website.leads.TelegramLeadDelivery: ERROR
app:
  leads:
    fingerprint-key: ${LEAD_FINGERPRINT_HMAC_KEY}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN}
    chat-id: ${TELEGRAM_CHAT_ID}
    base-url: ${TELEGRAM_BASE_URL:https://api.telegram.org}
